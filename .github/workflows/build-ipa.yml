name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: Optional version name (for example 2.6.0)
        required: false
        type: string
      build_number:
        description: Optional numeric build number
        required: false
        type: string
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  build-ipa:
    name: Build and verify unsigned iOS IPA
    needs: validate
    runs-on: macos-15
    timeout-minutes: 45
    env:
      BUILD_NAME: ${{ inputs.build_name }}
      BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Show Xcode and SDK versions
        run: |
          xcodebuild -version
          xcodebuild -showsdks
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Install dependencies
        run: |
          flutter precache --ios
          flutter pub get
      - name: Boot iPhone simulator
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for k,vs in d["devices"].items() if "iOS" in k for v in vs if v["name"].startswith("iPhone")))')
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
      - name: Verify native app startup on iPhone simulator
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          flutter test integration_test/app_launch_test.dart \
            -d "$SIMULATOR_ID" --dart-define=FLAVOR=community \
            --dart-define=IPA_BUILD=true 2>&1 | tee ios-simulator.log
          APP_DATA=$(xcrun simctl get_app_container "$SIMULATOR_ID" com.nightcode.luci data)
          mkdir -p output
          cp "$APP_DATA/Documents/ios-login.png" output/
      - name: Build unsigned app
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$BUILD_NAME" ]]; then
            [[ "$BUILD_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid build_name'; exit 1; }
            args+=("--build-name=$BUILD_NAME")
          fi
          if [[ -n "$BUILD_NUMBER" ]]; then
            [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo 'Invalid build_number'; exit 1; }
            args+=("--build-number=$BUILD_NUMBER")
          fi
          flutter build ios --release --no-codesign \
            --dart-define=FLAVOR=community \
            --dart-define=IPA_BUILD=true \
            "${args[@]}" 2>&1 | tee ios-build.log
      - name: Verify and package IPA
        run: python3 scripts/package_ios.py
      - name: Upload IPA and verification report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: YALA-iOS-unsigned-${{ github.run_number }}
          path: output/
          if-no-files-found: error
          retention-days: 30
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iOS-build-log-${{ github.run_number }}
          path: ios-build.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload simulator log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iOS-simulator-log-${{ github.run_number }}
          path: ios-simulator.log
          if-no-files-found: ignore
          retention-days: 14
