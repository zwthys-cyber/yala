name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v2.0.1)'
        required: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-release-notes:
    name: Generate Release Notes
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create Release with Notes
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          tag: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          generateReleaseNotes: true
          makeLatest: true

  build-android:
    name: Build Android
    runs-on: ubuntu-24.04
    needs: generate-release-notes
    permissions:
      contents: write

    steps:
        #1 Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

        #2 Setup Java
      - name: Set Up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle and caching
        uses: gradle/actions/setup-gradle@6cfc8b8e8bb586cc164bef1c478c1eea3a4d6a19 # v3
        with:
          cache-read-only: false

        #3 Setup Flutter
      - name: Set Up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

        #4 Install Dependencies
      - name: Install Dependencies
        run: flutter pub get

      - name: Disable jni GNU build-id
        run: sed -i -e 's/-Wl,/-Wl,--build-id=none,/' ${PUB_CACHE}/hosted/*/jni-*/src/CMakeLists.txt

        #5 Setup Keystore
      - name: Create Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > app/luci_mobile_keystore.jks
          echo "${{ secrets.ANDROID_KEY_PROPERTIES_BASE64 }}" | base64 --decode > key.properties
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES_BASE64: ${{ secrets.ANDROID_KEY_PROPERTIES_BASE64 }}
        working-directory: android

      - name: Build APKs (split per ABI)
        run: |
          flutter build apk --split-per-abi --release --flavor community --dart-define=FLAVOR=community --dart-define=OFFICIAL_BUILD=true
          mkdir -p build/app/outputs/apk-staging
          cp build/app/outputs/flutter-apk/app-*-community-release.apk build/app/outputs/apk-staging/

      - name: Build Universal APK
        run: |
          flutter build apk --release --flavor community --dart-define=FLAVOR=community --dart-define=OFFICIAL_BUILD=true
          cp build/app/outputs/apk-staging/app-*-community-release.apk build/app/outputs/flutter-apk/

      - name: Build appBundle
        run: flutter build appbundle --release --flavor community --dart-define=FLAVOR=community --dart-define=OFFICIAL_BUILD=true

      - name: Rename APKs to standard names
        run: |
          cd build/app/outputs/flutter-apk
          for f in app-*-community-release.apk; do
            newname="${f/-community-release.apk/-release.apk}"
            cp "$f" "$newname"
          done
          cp app-community-release.apk app-universal-release.apk || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Android-Release
          path: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/flutter-apk/app-universal-release.apk
            build/app/outputs/bundle/communityRelease/app-community-release.aab

      - name: Update Release with Artifacts
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          artifacts: "build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk,build/app/outputs/flutter-apk/app-arm64-v8a-release.apk,build/app/outputs/flutter-apk/app-x86_64-release.apk,build/app/outputs/flutter-apk/app-universal-release.apk,build/app/outputs/bundle/communityRelease/app-community-release.aab"
          tag: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          makeLatest: true
          omitBody: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true

